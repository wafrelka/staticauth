[package]
name = "staticauth"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0"
argon2 = "0.6"
axum = { version = "0.8", features = ["query"] }
axum-extra = { version = "0.12", features = ["cookie-signed", "typed-header"] }
chrono = { version = "0.4", features = ["serde", "clock"] }
clap = { version = "4.6", features = ["derive"] }
env_logger = "0.11"
hex = "0.4"
log = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.53", features = ["fs", "io-std", "io-util", "macros", "net", "rt-multi-thread"] }
toml = "1.1"
url = "2.5"

[dev-dependencies]
hyper = { version = "0.14", features = ["client", "http1", "tcp"] }
